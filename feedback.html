<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Feedback - VoteSmart</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<section class="features">

{% if submitted %}

    <div class="hero-card">

        <h1>
            ✅ Thank You!
        </h1>

        <p>
            Your feedback has been submitted.
        </p>

        <br>

        <a href="/"
           class="btn primary">
            Home
        </a>

    </div>

{% else %}

    <h1>💬 Give Us Feedback</h1>

    <br>

    <form method="POST">

        <div class="feature-card">

            <input
                type="text"
                name="name"
                placeholder="Your Name"
                required
                style="width:100%;padding:12px;margin-bottom:15px;"
            >

            <input
                type="email"
                name="email"
                placeholder="Email (optional)"
                style="width:100%;padding:12px;margin-bottom:15px;"
            >

            <textarea
                name="message"
                placeholder="Your feedback"
                required
                rows="6"
                style="width:100%;padding:12px;margin-bottom:15px;"
            ></textarea>

            <label>
                Rating
            </label>

            <br>

            <select
                name="rating"
                required
                style="padding:10px;margin:10px 0 20px;">

                <option value="">
                    Select Rating
                </option>

                <option value="5">
                    ⭐⭐⭐⭐⭐
                </option>

                <option value="4">
                    ⭐⭐⭐⭐
                </option>

                <option value="3">
                    ⭐⭐⭐
                </option>

                <option value="2">
                    ⭐⭐
                </option>

                <option value="1">
                    ⭐
                </option>

            </select>

            <br>

            <button
                type="submit"
                class="btn primary">

                Submit Feedback

            </button>

        </div>

    </form>

{% endif %}

</section>

</body>

</html>
