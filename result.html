<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quiz Result - VoteSmart</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<section class="features">

    <div class="hero-card">

        <div class="vote-icon">
            🎉
        </div>

        <h1>
            Quiz Completed!
        </h1>

        <h2>
            {{ name }}
        </h2>

        <p>
            Your score is:
        </p>

        <h1>
            {{ score }} / {{ total }}
        </h1>

        {% if score >= 4 %}

        <p>
            🌟 Excellent! You have good voter awareness.
        </p>

        {% elif score >= 3 %}

        <p>
            👍 Good job! Keep learning.
        </p>

        {% else %}

        <p>
            📚 Keep learning about voter awareness.
        </p>

        {% endif %}

        <br>

        <a href="/quiz"
           class="btn primary">
            Try Again
        </a>

        <a href="/"
           class="btn secondary">
            Home
        </a>

    </div>

</section>

</body>

</html>
